<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Winet</title>
  <meta name="description" content="{{ page.summary | default: page.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="theme-color" content="#f47722">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/winet-icon.png' | relative_url }}">
  <meta property="og:title" content="{{ page.title }} | Winet">
  <meta property="og:description" content="{{ page.summary | default: page.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/winet-logo.png' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include site-header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include site-footer.html %}
</body>
</html>
